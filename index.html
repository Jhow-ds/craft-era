<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Craft Era</title>
<meta name="description" content="Arraste componentes sobre a bancada e remonte, na ordem em que aconteceram, as invenções que construíram o mundo moderno.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Big+Shoulders+Display:wght@600;800&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
:root{
  --fundo:#14120f;
  --chapa:#1a1714;
  --chapa-alta:#211d19;
  --chapa-fundo:#151210;
  --grava:rgba(216,203,180,.05);
  --trilho:#322c26;
  --trilho-2:#3d362e;
  --tinta:#ece6da;
  --tinta-2:#b3a999;
  --tinta-3:#8d8478;
  --era:#b06a3b;
  --era-texto:#e09a5c;
  --r-peca:9px;
  --r-painel:14px;
  --lado-peca:132px;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif;
  --texto:"Archivo","Segoe UI",sans-serif;
  --medida:"Fragment Mono","Consolas",monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--fundo);color:var(--tinta);font-family:var(--texto);
  overflow:hidden;-webkit-font-smoothing:antialiased;
}
::selection{background:var(--era-texto);color:#17130f}
:focus-visible{outline:2px solid var(--era-texto);outline-offset:3px;border-radius:3px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--chapa-fundo)}
::-webkit-scrollbar-thumb{background:#3a332c;border:3px solid var(--chapa-fundo);border-radius:99px}
::-webkit-scrollbar-thumb:hover{background:#4d453b}

/* ─────────── TRILHO ─────────── */
.trilho{
  grid-area:trilho;display:flex;align-items:center;gap:20px;
  padding:0 30px;background:var(--chapa);border-bottom:1px solid var(--trilho);height:76px;
}
.marca{font-family:var(--display);font-weight:800;font-size:33px;letter-spacing:.005em;line-height:1;white-space:nowrap}
.talho{display:block;width:1px;height:30px;background:var(--trilho);flex:0 0 1px}
.eras{display:flex;gap:2px;align-items:center;min-width:0;overflow:hidden}
.era-btn{
  font-family:var(--medida);font-size:11px;letter-spacing:.06em;padding:6px 6px;white-space:nowrap;
  color:var(--tinta-3);border-bottom:2px solid transparent;transition:color .18s,border-color .18s;
}
.era-btn[data-estado="feito"]{color:var(--tinta-2)}
/* Fundo no tom claro da era: o tom escuro derrubava o contraste do texto
   miúdo em terracota, bronze e ferro (abaixo de 4,5:1).                */
.era-btn[data-estado="ativa"]{color:#17130f;background:var(--era-texto);border-bottom-color:var(--era-texto)}
.era-btn:hover{color:var(--tinta-2)}
.era-btn[data-estado="ativa"]:hover{color:#17130f}
.acoes{display:flex;align-items:center;gap:14px;margin-left:auto;flex:0 0 auto}
.contador{font-family:var(--medida);font-size:11.5px;color:var(--tinta-3);letter-spacing:.05em;white-space:nowrap}
.contador b{color:var(--era-texto);font-weight:400}
.btn-codex{
  font-family:var(--medida);font-size:11px;letter-spacing:.12em;padding:8px 13px;
  border:1px solid var(--trilho-2);color:var(--tinta-2);transition:border-color .18s,color .18s;
}
.btn-codex:hover{border-color:var(--era);color:var(--tinta)}

/* ─────────── BANCADA ─────────── */
.bancada{
  grid-area:bancada;position:relative;overflow:hidden;background:var(--chapa);
  /* Graduação da chapa: 40 × 40, desenhada como trama de 1px, não como
     listras decorativas.                                                */
  background-image:
    linear-gradient(0deg,var(--grava) 1px,transparent 1px),
    linear-gradient(90deg,var(--grava) 1px,transparent 1px);
  background-size:40px 40px;
}
.bancada::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(115% 85% at 32% 20%,rgba(255,240,212,.05),transparent 60%);
}
.selo{
  position:absolute;left:28px;top:22px;font-family:var(--medida);font-size:10px;
  letter-spacing:.15em;color:var(--tinta-3);z-index:1;pointer-events:none;
  transition:opacity .4s;
}
.selo[data-sumido="1"]{opacity:0}
.placa{position:absolute;inset:16px;pointer-events:none;z-index:0}
.pcr{position:absolute;width:24px;height:24px;border:0 solid rgba(216,203,180,.14)}
.pcr:nth-child(1){left:0;top:0;border-left-width:1px;border-top-width:1px}
.pcr:nth-child(2){right:0;top:0;border-right-width:1px;border-top-width:1px}
.pcr:nth-child(3){left:0;bottom:0;border-left-width:1px;border-bottom-width:1px}
.pcr:nth-child(4){right:0;bottom:0;border-right-width:1px;border-bottom-width:1px}
/* Marca de referência da chapa (datum target): círculo com ponto central.
   Um cruzamento de 1 px lia como botão de "adicionar" no meio da bancada. */
.datum{
  position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
  border:1px solid rgba(216,203,180,.12);border-radius:50%;
}
.datum::before{
  content:"";position:absolute;left:50%;top:50%;width:2px;height:2px;margin:-1px 0 0 -1px;
  border-radius:50%;background:rgba(216,203,180,.2);
}
.marcos-placa{
  position:absolute;right:30px;top:20px;z-index:1;display:flex;align-items:center;gap:11px;
  pointer-events:none;
}
.mp-rot{font-family:var(--medida);font-size:9.5px;letter-spacing:.15em;color:var(--tinta-3)}
.mp-lista{display:flex;gap:4px}
.mp{width:13px;height:13px;border:1px solid #3f3831;display:block;transition:background .3s,border-color .3s}
.mp[data-on="1"]{border-color:var(--era);background:var(--era)}

/* ─────────── GAVETA DE PEÇAS ───────────
   Coluna de componentes já descobertos, à direita da bancada. A lista
   rola na vertical e se divide por era: uma bandeja horizontal com 104
   peças virou uma tira longa demais para percorrer.                        */
.gaveta{
  grid-area:gaveta;position:relative;display:flex;flex-direction:column;
  min-height:0;min-width:0;overflow:hidden;
  background:var(--chapa-fundo);border-left:1px solid var(--trilho);
}
.gaveta[data-alvo="1"]{background:#1b1713}
.gaveta[data-alvo="1"] .gav-rot{color:var(--era-texto)}
.gav-cab{
  display:flex;align-items:baseline;gap:10px;
  padding:17px 18px 0;flex:0 0 auto;
}
.gav-rot{
  font-family:var(--medida);font-size:10px;letter-spacing:.16em;
  color:var(--tinta-3);flex:0 0 auto;
}
.gav-conta{
  margin-left:auto;font-family:var(--medida);font-size:9px;
  letter-spacing:.09em;color:var(--tinta-3);
}
.gav-ajuda{
  flex:0 0 auto;padding:6px 18px 12px;border-bottom:1px solid var(--trilho);
  font-family:var(--medida);font-size:8.5px;line-height:1.55;
  letter-spacing:.06em;color:#5c544a;
}
.gav-lista{
  flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;
  padding:1px 10px 14px;scrollbar-width:thin;
  scrollbar-color:#3f3831 transparent;
}
.gav-lista::-webkit-scrollbar{width:4px}
.gav-lista::-webkit-scrollbar-thumb{background:#3f3831}
.g-era{padding-top:7px}
.g-era + .g-era{border-top:1px solid #262019}
.g-era-cab{
  position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:7px;
  padding:7px 6px 5px;background:var(--chapa-fundo);
}
.g-era-cor{width:7px;height:7px;flex:0 0 7px;display:block}
.g-era-nome{
  font-family:var(--medida);font-size:9px;letter-spacing:.13em;
  color:var(--tinta-2);
}
.g-era-q{
  margin-left:auto;font-family:var(--medida);font-size:9px;
  letter-spacing:.06em;color:var(--tinta-3);
}
.g-era-itens{display:flex;flex-direction:column}
.gav-item{
  display:flex;align-items:center;gap:9px;width:100%;padding:6px 7px;
  font-family:inherit;font-size:12px;text-align:left;color:var(--tinta-2);
  background:none;border:1px solid transparent;cursor:pointer;
  transition:background .15s,border-color .15s,color .15s;
}
.gav-item:hover,.gav-item:focus-visible{
  color:var(--tinta);background:var(--chapa-alta);border-color:var(--trilho);outline:none;
}
.gav-item:focus-visible{border-color:var(--era)}
.gav-g{width:26px;height:26px;flex:0 0 26px;display:block}
.gav-g svg{width:26px;height:26px;display:block}
.gav-t{min-width:0;display:flex;flex-direction:column;gap:2px}
.gav-n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.25}
.gav-ano{
  font-family:var(--medida);font-size:8px;letter-spacing:.07em;color:var(--tinta-3);
}
.gav-item:hover .gav-ano,.gav-item:focus-visible .gav-ano{color:var(--tinta-3)}
.gav-nada{
  display:block;padding:14px 8px;font-family:var(--medida);
  font-size:9.5px;letter-spacing:.12em;color:var(--tinta-3);
}

/* ─────────── PEÇA ───────────
   Gramática da chapa (OWN-WORLD): rótulo em condensada industrial ACIMA da
   peça, medição em monoespaçada ABAIXO. O assento é o quadrado; a faixa da
   era corre na aresta de cima dele. Nada de cartão em volta do texto.     */
.peca{
  --lado:var(--lado-peca);
  position:absolute;width:var(--lado);padding:0;background:none;border:0;
  cursor:grab;touch-action:none;
  display:flex;flex-direction:column;align-items:center;
  z-index:2;
}
.assento{
  position:relative;width:var(--lado);height:var(--lado);flex:none;
  background:var(--chapa-alta);border:1px solid var(--trilho);border-radius:var(--r-peca);
  display:flex;align-items:center;justify-content:center;
  transition:border-color .2s cubic-bezier(.16,1,.3,1),background .2s;
}
.peca:hover .assento{border-color:#4b4339}
.peca.arrastando{cursor:grabbing;z-index:40}
.peca.arrastando .assento{
  border-color:var(--era);background:#262019;
  box-shadow:0 18px 40px rgba(0,0,0,.55),
             0 0 0 1px color-mix(in srgb,var(--era) 38%,transparent),
             0 0 30px color-mix(in srgb,var(--era) 20%,transparent);
}
.peca.alvo .assento{border-color:var(--era);background:#262019}
.peca.alvo .assento::after{
  content:"";position:absolute;inset:-5px;
  border:1px dashed color-mix(in srgb,var(--era) 55%,transparent);
  border-radius:13px;pointer-events:none;
}
/* Chegar perto energiza: o alvo pulsa um campo da cor da era. A pista é
   relacional, não decorativa — ela diz que o encaixe vai acontecer. */
.peca.alvo .assento::before{
  content:"";position:absolute;inset:-9px;border-radius:16px;pointer-events:none;
  border:1px solid color-mix(in srgb,var(--era) 68%,transparent);
  animation:campo 1.15s cubic-bezier(.16,1,.3,1) infinite;
}
@keyframes campo{
  0%{transform:scale(.94);opacity:.8}
  72%,100%{transform:scale(1.07);opacity:0}
}
.peca.montando .assento{border-style:dashed;border-color:var(--era)}
.peca.novidade{animation:chegar .5s cubic-bezier(.16,1,.3,1)}
@keyframes chegar{
  0%{transform:scale(.82);opacity:0}
  100%{transform:scale(1);opacity:1}
}
.peca.nega{animation:negar .34s cubic-bezier(.16,1,.3,1)}
@keyframes negar{
  0%,100%{transform:translateX(0)}
  22%{transform:translateX(-7px)}
  58%{transform:translateX(6px)}
}
.faixa{position:absolute;left:0;top:0;width:100%;height:4px;border-radius:9px 9px 0 0;background:var(--era)}
.grafico{display:flex;align-items:center;justify-content:center}
.grafico svg{width:66px;height:66px;display:block}
.nome{
  width:100%;margin-bottom:7px;padding:0 3px;
  font-family:var(--display);font-weight:600;font-size:13px;line-height:1.12;
  letter-spacing:.02em;text-transform:uppercase;
  text-align:center;color:var(--tinta-2);
}
.peca[data-didatico="0"] .nome{color:var(--tinta)}
.medida{
  margin-top:4px;padding:0 4px;
  font-family:var(--medida);font-size:8.5px;letter-spacing:.07em;text-align:center;
  color:var(--tinta-3);line-height:1.3;
}
.didatico{position:absolute;right:8px;top:11px;width:6px;height:6px;border-radius:50%;background:#5c544a}
.cadeia{
  position:absolute;top:10px;left:9px;display:flex;align-items:center;
}
.cadeia i{width:4px;height:4px;border-radius:50%;background:var(--era)}
/* A montagem é uma corrente: os nós se ligam por segmentos de 1px, como a
   ligação elo-nó do desenho de bancada — não uma fileira de pontos soltos. */
.cadeia i + i{margin-left:6px;position:relative}
.cadeia i + i::before{
  content:"";position:absolute;right:100%;top:1px;width:6px;height:1px;
  background:color-mix(in srgb,var(--era) 70%,transparent);
}

/* ─────────── LINHA DE UNIÃO ─────────── */
.uniao{position:absolute;height:1px;z-index:1;pointer-events:none;transform-origin:left center;
  background:linear-gradient(90deg,color-mix(in srgb,var(--era) 85%,transparent),color-mix(in srgb,var(--era) 12%,transparent))}
/* Olhal do fio: ponto sólido com anel de 1 px. Um halo de desfoque zero
   seria decoração, não profundidade. */
.uniao::after{
  content:"";position:absolute;right:-3px;top:-3px;width:7px;height:7px;border-radius:50%;
  background:var(--era);outline:1px solid color-mix(in srgb,var(--era) 34%,transparent);
  outline-offset:2px;
}
/* O fio também conduz: quando há encaixe próximo, ele pulsa. */
.uniao.energizada{
  height:2px;
  box-shadow:0 0 12px color-mix(in srgb,var(--era) 50%,transparent);
  animation:fluxo .9s ease-in-out infinite;
}
@keyframes fluxo{0%,100%{opacity:.62}50%{opacity:1}}

/* ─────────── SÍNTESE ───────────
   O momento autoral da bancada: dois componentes viram um. Núcleo, três
   ondas e a peça assentando na chapa — só quando a receita fecha.       */
.forja{position:fixed;width:0;height:0;z-index:39;pointer-events:none}
.forja i{
  position:absolute;left:0;top:0;width:20px;height:20px;margin:-10px;border-radius:50%;
  border:1px solid var(--era);opacity:0;
  animation:onda .74s cubic-bezier(.16,1,.3,1) forwards;
}
.forja i:nth-child(2){animation-delay:.09s}
.forja i:nth-child(3){animation-delay:.18s}
.forja b{
  position:absolute;left:0;top:0;width:22px;height:22px;margin:-11px;border-radius:50%;
  background:var(--era);opacity:0;
  animation:nucleo .6s cubic-bezier(.16,1,.3,1) forwards;
}
@keyframes onda{0%{transform:scale(.25);opacity:.9}100%{transform:scale(7);opacity:0}}
@keyframes nucleo{0%{transform:scale(.3);opacity:1}55%{transform:scale(1.5);opacity:.75}100%{transform:scale(2.4);opacity:0}}
.peca.sintetizada .assento{animation:sintese .78s cubic-bezier(.16,1,.3,1)}
@keyframes sintese{
  0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--era) 55%,transparent)}
  45%{box-shadow:0 0 34px 2px color-mix(in srgb,var(--era) 32%,transparent)}
  100%{box-shadow:0 0 0 0 transparent}
}

/* ─────────── NOTA ─────────── */
.nota{
  grid-area:nota;background:var(--chapa-fundo);border-left:1px solid var(--trilho);
  padding:20px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:16px;
}
.titulo-bloco{font-family:var(--medida);font-size:10px;letter-spacing:.15em;color:var(--tinta-3)}
.tentativa{display:flex;flex-direction:column;gap:7px}
.t-linha{display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--chapa-alta);border:1px solid var(--trilho)}
.t-ponto{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center}
.t-ponto svg{width:22px;height:22px}
.t-nome{flex:1;font-size:12.5px;color:var(--tinta-2);min-width:0}
.t-nome .b{display:block;font-family:var(--medida);font-size:9px;color:var(--tinta-3);margin-top:2px;letter-spacing:.06em}
.sem-nada{font-size:12.5px;color:var(--tinta-3);line-height:1.6;padding:10px 0}
.registro{border-top:1px solid var(--trilho);padding-top:16px}
.objetivo{border-top:1px solid var(--trilho);padding-top:16px;margin-top:auto}
.obj-txt{font-size:12.5px;line-height:1.62;color:var(--tinta-3);margin-top:9px}
.obj-txt b{color:var(--tinta-2);font-weight:500}
.reg-nome{font-family:var(--display);font-weight:600;font-size:25px;line-height:1.06;margin-bottom:8px}
.reg-meta{font-family:var(--medida);font-size:11px;color:var(--era-texto);letter-spacing:.05em;line-height:1.7}
.reg-meta span{display:block;color:var(--tinta-3)}
.reg-texto{font-size:12.5px;line-height:1.6;color:var(--tinta-2);margin-top:11px}
.marcas{display:flex;gap:7px;margin-top:13px;flex-wrap:wrap}
.marca-p{
  font-family:var(--medida);font-size:9px;letter-spacing:.08em;padding:4px 7px;
  border:1px solid var(--trilho-2);color:var(--tinta-3);
}
.marca-p.on{border-color:var(--era);color:var(--era-texto)}
/* Marcas desenhadas: nenhum glifo de fonte faz papel de ícone. */
.mk{
  display:inline-block;width:5px;height:5px;flex:0 0 5px;
  vertical-align:.05em;margin-right:5px;
}
.mk-cheio{border-radius:50%;background:currentColor}
.mk-vazio{border-radius:50%;border:1px solid currentColor}
.mk-central{transform:rotate(45deg);background:currentColor}
.reg-filho{
  margin-top:13px;padding-top:12px;border-top:1px solid var(--trilho);
  font-size:12px;line-height:1.6;color:var(--tinta-3);
}
.reg-filho b{color:var(--tinta-2);font-weight:500}

/* ─────────── FITA DE RECEITA ─────────── */
.fita{
  grid-area:fita;background:var(--chapa-fundo);border-top:1px solid var(--trilho);
  padding:19px 30px;display:flex;flex-direction:column;gap:13px;min-height:0;
}
.fita-cab{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
.fita-nome{font-family:var(--display);font-weight:600;font-size:21px;letter-spacing:.01em;line-height:1.1}
.fita-meta{font-family:var(--medida);font-size:10px;letter-spacing:.12em;color:var(--tinta-3)}
.fita-nada{font-size:13px;color:var(--tinta-3);line-height:1.6}
.passos{display:flex;align-items:center;flex-wrap:wrap;gap:0}
.passo{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  background:var(--chapa-alta);border:1px solid var(--trilho);transition:border-color .2s,background .2s;
}
.passo-ord{font-family:var(--medida);font-size:9.5px;color:var(--tinta-3)}
.passo.feito{border-color:color-mix(in srgb,var(--era) 45%,transparent)}
.passo.feito .passo-ord{color:var(--era-texto)}
.passo.atual{border-color:var(--era);background:#262019}
.passo.atual .passo-nome{color:var(--tinta)}
.passo-nome{font-size:13px;color:var(--tinta-2);white-space:nowrap}
.seta{width:24px;height:1px;background:var(--trilho-2);flex:0 0 24px;position:relative}
.mais{font-family:var(--medida);font-size:12px;color:var(--tinta-3);flex:0 0 18px;text-align:center}
.seta::after{content:"";position:absolute;right:0;top:-3px;border-left:5px solid #4d453b;
  border-top:3.5px solid transparent;border-bottom:3.5px solid transparent}
.aguardando{
  padding:8px 15px;border:1px dashed var(--trilho-2);
  font-family:var(--medida);font-size:9.5px;letter-spacing:.1em;color:var(--tinta-3);
}

/* ─────────── AVISO ─────────── */
.aviso{
  position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#2b2520;border:1px solid var(--trilho-2);padding:10px 18px;
  font-size:13px;color:var(--tinta);z-index:60;pointer-events:none;
  opacity:0;transition:opacity .3s;box-shadow:0 12px 34px rgba(0,0,0,.5);
}
.aviso[data-visivel="1"]{opacity:1}

/* ─────────── DICA DE PEÇA ───────────
   Hover e foco abrem a ficha do componente: nome, como foi criado, o que
   ele é e o que destrava. Fica fora do fluxo, colada ao item, e some no
   primeiro gesto que exigir a mão.                                      */
.dica{
  position:fixed;left:0;top:0;z-index:65;width:312px;max-width:calc(100vw - 28px);
  padding:15px 17px 16px;pointer-events:none;
  background:var(--chapa-alta);border:1px solid var(--trilho-2);
  box-shadow:0 18px 44px rgba(0,0,0,.62);
  opacity:0;transform:translateY(5px);
  transition:opacity .14s,transform .14s cubic-bezier(.16,1,.3,1);
}
.dica[data-visivel="1"]{opacity:1;transform:translateY(0)}
.dica::before{
  content:"";position:absolute;left:-1px;right:-1px;top:-1px;height:2px;
  background:var(--dica-cor,var(--era));
}
.dica-era{display:flex;align-items:center;gap:7px;font-family:var(--medida);font-size:9px;letter-spacing:.13em;color:var(--tinta-3)}
.dica-era i{width:7px;height:7px;flex:0 0 7px;display:block;background:var(--dica-cor,var(--era))}
.dica-nome{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.04;margin-top:8px}
.dica-meta{font-family:var(--medida);font-size:9.5px;letter-spacing:.06em;color:var(--tinta-3);margin-top:5px}
.dica-meta b{color:var(--dica-cor,var(--era-texto));font-weight:400}
.dica-bloco{margin-top:12px;border-top:1px solid #262019;padding-top:10px}
.dica-rot{display:block;font-family:var(--medida);font-size:8.5px;letter-spacing:.15em;color:var(--tinta-3)}
.dica-txt{margin-top:5px;font-size:12px;line-height:1.55;color:var(--tinta-2)}
.dica-txt em{font-style:normal;color:var(--tinta)}
.dica-txt .dica-ordem{display:block;margin-top:4px;font-family:var(--medida);font-size:8.5px;letter-spacing:.09em;color:var(--tinta-3)}

/* ─────────── CÓDIGO ─────────── */
.codigo-fundo{
  position:fixed;inset:0;background:rgba(10,9,8,.76);z-index:70;
  opacity:0;pointer-events:none;transition:opacity .26s;
}
.codigo-fundo[data-aberto="1"]{opacity:1;pointer-events:auto}
.codigo{
  position:fixed;right:0;top:0;bottom:0;width:min(460px,100%);
  background:var(--chapa);border-left:1px solid var(--trilho);z-index:71;
  transform:translateX(100%);transition:transform .34s cubic-bezier(.16,1,.3,1);
  display:flex;flex-direction:column;
}
.codigo-fundo[data-aberto="1"] + .codigo{transform:translateX(0)}
.codigo-cab{display:flex;align-items:center;gap:14px;padding:20px 22px;border-bottom:1px solid var(--trilho);flex:0 0 auto}
.codigo-tit{font-family:var(--display);font-weight:600;font-size:22px}
.fechar{font-family:var(--medida);font-size:10px;letter-spacing:.12em;color:var(--tinta-3);
  border:1px solid var(--trilho-2);padding:7px 11px;margin-left:auto}
.fechar:hover{color:var(--tinta);border-color:var(--era)}
.codigo-corpo{overflow-y:auto;padding:8px 22px 26px}
.era-secao{padding-top:20px}
.era-cab{display:flex;align-items:center;gap:9px;margin-bottom:11px}
.era-cor{width:11px;height:11px;flex:0 0 11px}
.era-nome{font-family:var(--medida);font-size:10px;letter-spacing:.14em;color:var(--tinta-2)}
.era-q{margin-left:auto;font-family:var(--medida);font-size:9.5px;color:var(--tinta-3)}
.reg{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid #262019;align-items:flex-start}
.reg-g{width:38px;height:38px;flex:0 0 38px;opacity:.95}
.reg-g svg{width:38px;height:38px}
.reg.bloq .reg-g{opacity:.2}
.reg-t{flex:1;min-width:0}
.reg-n{font-size:13px;color:var(--tinta);line-height:1.3}
.reg.bloq .reg-n{color:var(--tinta-3)}
.reg-d{font-family:var(--medida);font-size:9px;color:var(--tinta-3);margin-top:3px;letter-spacing:.05em}
.reg.bloq .reg-d{color:#5c544a}
.reg-star{margin-left:auto;color:var(--era-texto);border:1px solid var(--trilho-2);
  padding:2px 5px;flex:0 0 auto;display:flex;align-items:center;justify-content:center}
.reg-star .mk{margin-right:0}

/* ─────────── REVELAÇÃO ─────────── */
.revelacao{
  position:fixed;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;
  background:rgba(10,9,8,.8);opacity:0;pointer-events:none;transition:opacity .4s;
  padding:24px;
}
.revelacao[data-visivel="1"]{opacity:1;pointer-events:auto}
.rev-caixa{
  background:var(--chapa-alta);border:1px solid var(--trilho-2);padding:34px 36px;max-width:560px;width:100%;
  box-shadow:0 28px 70px rgba(0,0,0,.6);transform:translateY(10px);transition:transform .4s cubic-bezier(.16,1,.3,1);
  position:relative;overflow:hidden;
}
.revelacao[data-visivel="1"] .rev-caixa{transform:translateY(0)}
.rev-caixa::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--era)}
.rev-corpo{display:flex;gap:20px;align-items:flex-start}
.rev-g{width:80px;height:80px;flex:0 0 80px}
.rev-g svg{width:80px;height:80px}
.rev-nome{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.02}
.rev-meta{font-family:var(--medida);font-size:11.5px;color:var(--tinta-3);margin-top:10px;letter-spacing:.05em;line-height:1.7}
.rev-era{display:block;color:var(--era-texto)}
.rev-idade,.rev-central{white-space:nowrap}
.rev-central{display:inline-block;margin-left:12px}
.rev-meta .mk{margin-left:0}
.rev-autor{display:block}
.rev-texto{font-size:14px;line-height:1.68;color:var(--tinta-2);margin-top:18px}
.rev-acoes{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
.rev-btn{font-family:var(--medida);font-size:11px;letter-spacing:.12em;padding:10px 15px;border:1px solid var(--trilho-2);color:var(--tinta-2)}
.rev-btn.p{background:var(--era-texto);border-color:var(--era-texto);color:#17130f}
.rev-btn:hover{border-color:var(--era);color:var(--tinta)}
.rev-btn.p:hover{color:#17130f;filter:brightness(1.08)}

/* ─────────── GRADE ─────────── */
.app{
  display:grid;height:100vh;
  grid-template-columns:minmax(0,1fr) 300px 336px;
  grid-template-rows:76px minmax(0,1fr) 164px;
  grid-template-areas:"trilho trilho trilho" "bancada gaveta nota" "fita fita fita";
}
.trilho,.bancada,.gaveta,.nota,.fita{min-width:0}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}

/* No empilhado a gaveta deixa a coluna e se deita ao lado do registro:
   a lista continua vertical, só muda de dono da faixa.                    */
@media (max-width:1180px){
  .app{grid-template-columns:minmax(0,1fr) minmax(0,1fr);
       grid-template-rows:76px minmax(0,1fr) 196px 164px;
       grid-template-areas:"trilho trilho" "bancada bancada" "gaveta nota" "fita fita"}
  .gaveta{border-left:none;border-top:1px solid var(--trilho)}
  .nota{border-left:1px solid var(--trilho);border-top:1px solid var(--trilho);
        height:auto;padding:15px 18px;gap:13px}
  .objetivo{display:none}
  .talho{display:none}
  .era-btn{padding:5px 7px;font-size:9px;letter-spacing:.06em}
  .trilho{padding:0 20px;gap:16px}
}
@media (max-width:880px){
  .eras{display:none}
}
@media (max-width:720px){
  .app{grid-template-columns:minmax(0,1fr);
       grid-template-rows:64px minmax(0,1fr) 126px 92px 140px;
       grid-template-areas:"trilho" "bancada" "gaveta" "nota" "fita"}
  .trilho{height:64px;padding:0 16px;gap:14px}
  .marca{font-size:26px}
  .contador{display:none}
  :root{--lado-peca:112px}
  .nome{font-size:11.5px}
  .grafico svg{width:54px;height:54px}
  .fita{padding:14px 16px}
  .gav-cab{padding:11px 16px 0}
  .gav-ajuda{display:none}
  .gav-lista{padding:1px 8px 10px}
  .g-era-cab{padding:5px 4px 4px}
  .selo{display:none}
  .mp-rot{display:none}
  .marcos-placa{right:16px;top:14px}
  .gav-item{padding:5px 6px;font-size:11px}
  .gav-g{width:22px;height:22px;flex:0 0 22px}
  .gav-g svg{width:22px;height:22px}
}
/* Aparelhos curtos: coluna, fita, gaveta e assento encolhem juntos para a
   bancada não perder as duas fileiras de peças. */
@media (max-width:1180px) and (max-height:780px){
  :root{--lado-peca:100px}
  .fita{padding:13px 18px}
  /* Sem altura para a frase de instrução: a coluna já a diz por extenso. */
  .fita-nada{display:none}
  .nome{font-size:11px}
  .grafico svg{width:48px;height:48px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

"prensa":{e:"ferro",ano:"c. 1450",autor:"Johannes Gutenberg, Mainz",star:1,n:"Prensa tipográfica",

const chave = (s) => s.length <= 2 ? [...s].sort().join("|") : s.join(">");
const MAPA = new Map();
const ORDENADAS = [];
for (const r of RECEITAS){
  ORDENADAS.push(r);
  if (!MAPA.has(chave(r.seq))) MAPA.set(chave(r.seq), r);
}
/* A comparação percorre `s` (o que já foi montado), nunca a receita
   inteira — senão os passos que faltam nunca conferem.                 */
const podeSerPrefixo = (s) =>
  ORDENADAS.some(r => r.seq.length > s.length && s.every((v,i) => v === r.seq[i]));

function proximoPassoDe(s){
  for (const r of ORDENADAS) if (r.seq.length > s.length && s.every((v,i) => v === r.seq[i]))
    return { r, passo: s.length };
  return null;
}

function novaPeca(id, x, y, cadeia){
  return { id, cadeia: cadeia || [id], x, y, uid: ++S.seq, montando:false };
}

function criarEl(p){
  const d = IT[p.id];
  const el = document.createElement("div");
  el.className = "peca";
  el.dataset.uid = p.uid;
  el.dataset.didatico = d.ano ? "0" : "1";
  el.tabIndex = 0;
  el.setAttribute("role", "button");
  el.style.left = p.x + "px";
  el.style.top  = p.y + "px";

  const rotulo = d.ano ? `${d.n}, ${d.ano}` : `${d.n}, construção didática`;
  el.setAttribute("aria-label", rotulo +
    (p.cadeia.length > 1 ? `, montagem em ${p.cadeia.length} etapas` : "") +
    ". Botão direito remove da bancada.");

  el.innerHTML =
    `<div class="nome">${d.n}</div>` +
    `<div class="assento">` +
      `<div class="faixa" style="background:${ERA[d.e].cor}"></div>` +
      (p.cadeia.length > 1 ? `<div class="cadeia">${p.cadeia.map(() => "<i></i>").join("")}</div>` : "") +
      `<div class="grafico">${d.g}</div>` +
      (d.ano ? "" : `<div class="didatico" title="Construção didática do jogo, não um marco histórico"></div>`) +
    `</div>` +
    `<div class="medida">${d.ano ? d.ano.toUpperCase() : "CONSTRUÇÃO DIDÁTICA"}</div>`;

  el.style.setProperty("--p1", "var(--tinta)");
  el.style.setProperty("--p2", "#8d8478");
  const pat = PATINA[p.id];
  if (pat) el.style.setProperty("--p3", MAT[pat]);
  return el;
}

/* ── DESCOBERTA ────────────────────────────────────────────
   Só quem tem quadros acende, e só no instante em que nasce.
   Na bancada, movimento é evento — não decoração.             */
function acender(el, d){
  if (!d.q || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const g = el.querySelector(".grafico");
  if (!g) return;
  const quadros = [d.g, ...d.q];
  let i = 0;
  const t = setInterval(() => {
    if (!el.isConnected) { clearInterval(t); return; }
    i = (i + 1) % quadros.length;
    g.innerHTML = quadros[i];
  }, 160);
  setTimeout(() => {
    clearInterval(t);
    if (el.isConnected) g.innerHTML = d.g;
  }, 980);
}

function desenhar(){
  bancada.querySelectorAll(".peca,.uniao").forEach(n => n.remove());
  for (const p of S.bancada){
    const el = criarEl(p);
    if (p.montando) el.classList.add("montando");
    if (p.novo) { el.classList.add("novidade"); p.novo = false; }
    if (p.sintese) { el.classList.add("sintetizada"); p.sintese = false; }
    if (p.viva) { p.viva = false; acender(el, IT[p.id]); }
    p.el = el;
    bancada.appendChild(el);
  }
  ligarPecas();
  renderGaveta();
}

/* Altura útil da bancada. A gaveta saiu do pé da chapa e virou coluna, então
   a chapa inteira é área de trabalho.                                    */
function alturaUtil(){

}

/* Largura do assento, lida do CSS: 132 no desktop, 112 no celular, 100 em
   telas curtas. O JS não deve carregar esses números duplicados.          */
function ladoPeca(){
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--lado-peca"));
  return v > 0 ? v : 132;
}

/* Altura real de uma peça no CSS corrente, medida no pior caso (rótulo de
   duas linhas e medida de duas linhas). Sem isso o semeio chutava a altura e
   duas peças caíam na mesma faixa em telas curtas.                        */
function alturaPeca(){
  const sonda = document.createElement("div");
  sonda.className = "peca";
  sonda.setAttribute("aria-hidden", "true");
  sonda.style.cssText = "left:-9999px;top:0;visibility:hidden";
  sonda.innerHTML = '<div class="nome">ESTRUTURA DE PRENSA</div>' +
    '<div class="assento"><div class="faixa"></div><div class="grafico"></div></div>' +
    '<div class="medida">CONSTRUÇÃO DIDÁTICA</div>';
  bancada.appendChild(sonda);
  const h = sonda.offsetHeight;
  sonda.remove();
  return h || ladoPeca() + 46;
}

/* ═══════════════ FICHA DA PEÇA (DICA) ═══════════════
   Hover e foco contam a mesma história: nome, como foi criada, o que é e
   o que destrava. A ficha serve à peça da bancada e à linha da gaveta.  */
function primeiraFrase(txt){
  const m = String(txt).match(/^.*?[.!?](?=\s|$)/);
  return m ? m[0] : txt;
}
function comoFoiCriada(id){
  const r = RECEITAS.find(x => x.out === id);
  if (!r){
    return INICIAIS.includes(id)
      ? "Material inicial — já está na bancada desde o começo."
      : "Peça base da árvore.";
  }
  return r.seq.map(x => IT[x].n).join(" + ");
}
function oQueDesbloqueia(id){
  const nomes = [...new Set(RECEITAS.filter(r => r.seq.includes(id)).map(r => IT[r.out].n))];
  return nomes.length ? nomes.join(" · ") : "Nada nesta árvore — é um marco final.";
}
function abrirDica(id, el, p){
  const d = IT[id];
  if (!d) return;
  const r = RECEITAS.find(x => x.out === id);
  const etapas = r
    ? `${r.seq.length} ${r.seq.length === 2 ? "ETAPAS · ORDEM LIVRE" : "ETAPAS · A ORDEM IMPORTA"}`
    : (INICIAIS.includes(id) ? "MATERIAL INICIAL" : "");
  const meta = d.ano
    ? `${d.ano}${d.autor ? ` · ${d.autor}` : ""}`
    : "CONSTRUÇÃO DIDÁTICA · SEM DATA PRÓPRIA";
  dica.style.setProperty("--dica-cor", ERA[d.e].txt);
  dica.innerHTML =
    `<div class="dica-era"><i></i>${ERA[d.e].nome}${d.star ? " · MARCO" : ""}</div>` +
    `<div class="dica-nome">${d.n}</div>` +
    `<div class="dica-meta">${meta}</div>` +
    `<div class="dica-bloco"><span class="dica-rot">COMO FOI CRIADO</span>` +
      `<p class="dica-txt"><em>${comoFoiCriada(id)}</em>` +
      `${etapas ? `<span class="dica-ordem">${etapas}${p && p.cadeia.length > 1 ? ` · MONTAGEM EM ${p.cadeia.length} ETAPAS` : ""}</span>` : ""}</p></div>` +
    `<div class="dica-bloco"><span class="dica-rot">O QUE É</span>` +
      `<p class="dica-txt">${d.txt ? primeiraFrase(d.txt) : (d.ano ? "Marco histórico datado; o registro completo abre quando você o descobre." : "Degrau didático do jogo, sem data histórica própria.")}</p></div>` +
    `<div class="dica-bloco"><span class="dica-rot">DESBLOQUEIA</span>` +
      `<p class="dica-txt">${oQueDesbloqueia(id)}</p></div>`;
  dica.dataset.visivel = "1";
  dica.setAttribute("aria-hidden", "false");
  posicionarDica(el);
}
function posicionarDica(el){
  if (!el) return;
  const r = el.getBoundingClientRect();
  const w = dica.offsetWidth, h = dica.offsetHeight, gap = 12;
  let left = r.right + gap;
  if (left + w > innerWidth - gap) left = r.left - w - gap;
  if (left < gap) left = Math.min(innerWidth - w - gap, Math.max(gap, r.left));
  let top = r.top + r.height / 2 - h / 2;
  top = Math.max(gap, Math.min(innerHeight - h - gap, top));
  dica.style.left = Math.round(left) + "px";
  dica.style.top = Math.round(top) + "px";
}
let dicaT;
function agendarDica(id, el, p){
  clearTimeout(dicaT);
  dicaT = setTimeout(() => abrirDica(id, el, p), 110);
}
function fecharDica(){
  clearTimeout(dicaT);
  dica.dataset.visivel = "0";
  dica.setAttribute("aria-hidden", "true");
}

/* ═══════════════ GAVETA ═══════════════
   Coluna de componentes já descobertos, agrupada por era. Fundir consome
   as duas peças; sem a gaveta o jogador ficaria sem madeira depois da
   primeira combinação e a partida morreria ali.                        */
function renderGaveta(){
  const lista = $("gavLista");
  const ids = [...INICIAIS, ...[...S.feitos].filter(id => !INICIAIS.includes(id))];
  $("gavConta").textContent = `${ids.length} DESCOBERTA${ids.length === 1 ? "" : "S"}`;
  if (!ids.length){
    lista.innerHTML = `<span class="gav-nada">NADA AINDA</span>`;
    return;
  }
  const porEra = new Map(ERAS.map(e => [e.id, []]));
  ids.forEach(id => {
    const d = IT[id];
    if (d && porEra.has(d.e)) porEra.get(d.e).push(id);
  });
  lista.innerHTML = ERAS.map(e => {
    const itens = porEra.get(e.id);
    if (!itens.length) return "";
    const total = Object.keys(IT).filter(id => IT[id].e === e.id).length;
    return `<section class="g-era" data-era="${e.id}" role="group" aria-label="${e.nome}">
      <div class="g-era-cab">
        <span class="g-era-cor" style="background:${e.cor}"></span>
        <span class="g-era-nome">${e.nome}</span>
        <span class="g-era-q">${itens.length}/${total}</span>
      </div>
      <div class="g-era-itens">${itens.map(id => {
        const d = IT[id];
        return `<button class="gav-item" type="button" data-id="${id}"
          aria-label="Trazer uma cópia de ${d.n} para a bancada">` +
          `<span class="gav-g" aria-hidden="true">${arte(id)}</span>` +
          `<span class="gav-t"><span class="gav-n">${d.n}</span>` +
          `<span class="gav-ano">${d.ano ? d.ano.toUpperCase() : "DIDÁTICO"}</span></span></button>`;
      }).join("")}</div>
    </section>`;
  }).join("");
}

/* Devolver uma peça à gaveta é o único jeito de abrir espaço sem fundir —
   sem isso a bancada entope e a partida trava. O botão direito faz o mesmo
   sem exigir o arraste até a coluna.                                    */
function devolverPeca(p){
  S.bancada = S.bancada.filter(o => o !== p);
  fecharDica();
  desenhar();
  falar(`${IT[p.id].n} devolvido à gaveta.`);
}
function removerPeca(p){
  S.bancada = S.bancada.filter(o => o !== p);
  fecharDica();
  desenhar();
  falar(`${IT[p.id].n} removido da bancada.`);
  mostrarAviso(`${IT[p.id].n} removido da bancada`);
}

function puxarPeca(id){
  if (S.bancada.length >= 24){
    mostrarAviso("Bancada cheia — remova uma peça com o botão direito ou funda duas.");
    falar("A bancada está cheia. Remova uma peça com o botão direito ou funda duas.");
    return;
  }
  const W = bancada.clientWidth, H = alturaUtil();
  const larg = ladoPeca(), alt = alturaPeca();
  const faixa = Math.max(0, H - FAIXA_TOPO - alt);
  let x = Math.min(W - larg - 16, Math.max(16, W / 2 - larg / 2));
  let y = Math.min(H - alt - 12, Math.max(FAIXA_TOPO + 10, H / 2 - alt / 2));
  for (let k = 0; k < POSICOES.length; k++){
    const [fx, fy] = POSICOES[(S.bancada.length + k) % POSICOES.length];
    const cx = Math.min(W - larg - 16, Math.max(16, fx * W - larg / 2));
    const cy = Math.min(H - alt - 12, Math.max(FAIXA_TOPO + 10, FAIXA_TOPO + fy * faixa));
    if (S.bancada.every(o => Math.hypot(o.x - cx, o.y - cy) > 118)){ x = cx; y = cy; break; }
  }
  const p = novaPeca(id, Math.round(x), Math.round(y));
  p.novo = true;
  S.bancada.push(p);
  desenhar();
  falar(`${IT[id].n} trazido para a bancada.`);
}

/* ═══════════════ POSIÇÕES INICIAIS ═══════════════
   Peças espalhadas como componentes sobre uma chapa — nunca uma grade
   de cartões alinhados, que é justamente o desenho que o mundo recusa. */
const FAIXA_TOPO = 46;
const POSICOES = [
  [.12,.16],[.36,.80],[.60,.08],[.82,.58],
  [.22,.72],[.66,.74],[.46,.30],[.90,.20]
];
function semear(){
  const W = bancada.clientWidth, H = alturaUtil();
  const estreito = W < 640;
  const larg = ladoPeca(), alt = alturaPeca();
  S.bancada = INICIAIS.map((id, i) => {
    let x, y;
    if (estreito){
      /* Duas fileiras distribuídas na altura útil, com uma faixa de topo
         curta (a etiqueta da bancada some no celular e os quadrados de
         marcos param em 27 px).                                         */
      const col = i % 2, lin = Math.floor(i / 2);
      const linhas = Math.ceil(INICIAIS.length / 2);
      const sobra = Math.max(0, H - 30 - alt * linhas);
      const passo = alt + (linhas > 1 ? Math.min(12, sobra / (linhas - 1)) : 0);
      x = (W * (col + .5)) / 2 - larg / 2;
      y = Math.min(H - alt - 2, 30 + lin * passo);
    } else {
      const [fx, fy] = POSICOES[i % POSICOES.length];
      const faixa = Math.max(0, H - FAIXA_TOPO - alt);
      x = Math.min(W - larg - 16, Math.max(16, fx * W - larg / 2));
      y = Math.min(H - alt - 20, Math.max(FAIXA_TOPO + 10, FAIXA_TOPO + fy * faixa));
    }
    return novaPeca(id, Math.round(x), Math.round(y));
  });
}

/* ═══════════════ ARRASTAR ═══════════════ */
let arraste = null, uniaoEl = null;

function ligarPecas(){
  S.bancada.forEach(p => {
    if (!p.el) return;
    p.el.addEventListener("pointerdown", pegarPeca);
    p.el.addEventListener("keydown", tecladoPeca);
    p.el.addEventListener("contextmenu", menuPeca);
    p.el.addEventListener("pointerenter", () => { if (!arraste) agendarDica(p.id, p.el, p); });
    p.el.addEventListener("pointerleave", () => { if (!arraste) fecharDica(); });
    p.el.addEventListener("focus", () => { if (!arraste) agendarDica(p.id, p.el, p); });
    p.el.addEventListener("blur", fecharDica);
  });
}

function dentro(x, y){
  const r = bancada.getBoundingClientRect();
  return { x: x - r.left, y: y - r.top };
}

/* A gaveta agora mora à direita da chapa: o alvo de devolução é um
   retângulo, não a faixa inferior inteira.                              */
function sobreGaveta(ev){
  const r = $("gaveta").getBoundingClientRect();
  return ev.clientX >= r.left && ev.clientX <= r.right &&
         ev.clientY >= r.top && ev.clientY <= r.bottom;
}

/* Botão direito sobre uma peça da bancada remove a peça sem exigir que
   ela seja arrastada até a gaveta. A descoberta continua guardada.     */
function menuPeca(ev){
  ev.preventDefault();
  const p = elDe(+ev.currentTarget.dataset.uid);
  if (p && !arraste) removerPeca(p);
}

function pegarPeca(ev){
  const uid = +ev.currentTarget.dataset.uid;
  const p = elDe(uid);
  if (!p) return;
  ev.preventDefault();
  fecharDica();
  try { ev.currentTarget.setPointerCapture(ev.pointerId); } catch (e) {}
  ev.currentTarget.focus();
  const pt = dentro(ev.clientX, ev.clientY);
  arraste = { p, dx: pt.x - p.x, dy: pt.y - p.y, movido:false, alvo:null };
  ev.currentTarget.classList.add("arrastando");
  uniaoEl = document.createElement("div");
  uniaoEl.className = "uniao";
  document.body.appendChild(uniaoEl);
  ev.currentTarget.addEventListener("pointermove", mover);
  ev.currentTarget.addEventListener("pointerup", soltar, { once:true });
  ev.currentTarget.addEventListener("pointercancel", soltar, { once:true });
}

function mover(ev){
  if (!arraste) return;
  const pt = dentro(ev.clientX, ev.clientY);
  arraste.p.x = Math.max(0, Math.min(bancada.clientWidth - ladoPeca(), pt.x - arraste.dx));
  const altPeca = arraste.p.el.offsetHeight || 140;
  arraste.p.y = Math.max(0, Math.min(alturaUtil() - altPeca, pt.y - arraste.dy));
  arraste.p.el.style.left = arraste.p.x + "px";
  arraste.p.el.style.top  = arraste.p.y + "px";
  arraste.movido = true;
  $("selo").dataset.sumido = "1";

  const alvo = melhorAlvo(arraste.p);
  arraste.alvo = alvo;
  S.bancada.forEach(o => { if (o.el) o.el.classList.toggle("alvo", o === alvo); });
  desenharUniao(alvo);
  $("gaveta").dataset.alvo = sobreGaveta(ev) ? "1" : "0";
}

const centro = (p) => {
  const a = p.el && p.el.querySelector(".assento");
  if (!a) return { x: p.x + 66, y: p.y + 66 };
  return { x: p.x + a.offsetLeft + a.offsetWidth / 2, y: p.y + a.offsetTop + a.offsetHeight / 2 };
};

function melhorAlvo(origem){
  let melhor = null, dist = 96;
  for (const o of S.bancada){
    if (o === origem) continue;
    const a = centro(origem), b = centro(o);
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (d < dist){ dist = d; melhor = o; }
  }
  return melhor;
}

function desenharUniao(alvo){
  if (!uniaoEl) return;
  uniaoEl.classList.toggle("energizada", !!alvo);
  if (!alvo){ uniaoEl.style.width = "0px"; return; }
  const r = bancada.getBoundingClientRect();
  const a = centro(arraste.p), b = centro(alvo);
  const x = Math.min(a.x, b.x), y = Math.min(a.y, b.y);
  const dx = b.x - a.x, dy = b.y - a.y;
  const ang = Math.atan2(dy, dx);
  uniaoEl.style.left = (r.left + x) + "px";
  uniaoEl.style.top  = (r.top + y - .5) + "px";
  uniaoEl.style.width = Math.hypot(dx, dy) + "px";
  uniaoEl.style.transform = `rotate(${ang}rad)`;
}

function soltar(ev){
  if (!arraste) return;
  const { p, alvo, movido } = arraste;
  const gav = $("gaveta");
  const devolve = movido && sobreGaveta(ev);
  gav.dataset.alvo = "0";
  p.el.classList.remove("arrastando");
  S.bancada.forEach(o => { if (o.el) o.el.classList.remove("alvo"); });
  if (uniaoEl){ uniaoEl.remove(); uniaoEl = null; }
  arraste = null;
  if (devolve) devolverPeca(p);
  else if (alvo) engatar(alvo, p);
  else if (movido) repositionar(p);
}

function repositionar(p){
  p.x = Math.max(0, Math.min(bancada.clientWidth - ladoPeca(), p.x));
  p.y = Math.max(0, Math.min(alturaUtil() - (p.el?.offsetHeight || 140), p.y));
}

/* ═══════════════ TECLADO ═══════════════ */
function tecladoPeca(ev){
  const p = elDe(+ev.currentTarget.dataset.uid);
  if (!p) return;
  const passo = 16;
  const teclas = {
    ArrowLeft:[-passo,0], ArrowRight:[passo,0], ArrowUp:[0,-passo], ArrowDown:[0,passo]
  };
  if (teclas[ev.key]){
    ev.preventDefault();
    p.x = Math.max(0, Math.min(bancada.clientWidth - ladoPeca(), p.x + teclas[ev.key][0]));
    p.y = Math.max(0, Math.min(alturaUtil() - (p.el?.offsetHeight || 140), p.y + teclas[ev.key][1]));
    p.el.style.left = p.x + "px"; p.el.style.top = p.y + "px";
    return;
  }
  if (ev.key === "Delete" || ev.key === "Backspace"){
    ev.preventDefault();
    removerPeca(p);
    return;
  }
  if (ev.key === "Enter" || ev.key === " "){
    ev.preventDefault();
    const sel = S.bancada.find(o => o.el === document.activeElement);
    if (sel === p){
      p.selec = true; p.el.style.borderColor = "var(--era)";
      falar(`${IT[p.id].n} levantado. Escolha outro componente e pressione Enter para engatar.`);
    } else if (S.bancada.some(o => o.selec)){
      const origem = S.bancada.find(o => o.selec);
      origem.selec = false; origem.el.style.borderColor = "";
      engatar(p, origem);
    }
  }
}

/* ═══════════════ COMBINAÇÃO ═══════════════ */
/* Fundir duas peças. A ordem dos ingredientes de uma receita longa não
   pode depender de qual peça foi arrastada: o jogador não tem como saber
   quem é "base". Então testamos as duas concatenações — a montagem em
   curso (cadeia maior) vem primeiro, e no empate vale a que fecha
   receita ou prefixo de receita.                                       */
function engatar(base, entrada){
  const A = base.cadeia, B = entrada.cadeia;
  const cands = A.length === B.length
    ? [[...A, ...B], [...B, ...A]]
    : [A.length > B.length ? [...A, ...B] : [...B, ...A]];

  S.tentativa = [
    { id: base.id, cadeia: base.cadeia.slice() },
    { id: entrada.id, cadeia: entrada.cadeia.slice() }
  ];

  let seq = null, r = null, prox = null;
  for (const s of cands){
    const rr = MAPA.get(chave(s));
    if (rr){ seq = s; r = rr; break; }
    const pp = proximoPassoDe(s);
    if (pp && !prox){ seq = s; prox = pp; }
  }
  if (!seq) seq = cands[0];

  if (r) return fundir(r, seq, base, entrada);
  if (prox) return montarEm(prox, seq, base, entrada);
  falhar(base, entrada);
}

function fundir(r, seq, base, entrada){
  const item = IT[r.out];
  const inedito = !S.feitos.has(r.out);
  S.feitos.add(r.out);
  S.montagem = { r, feitos: r.seq.length };

  const x = Math.round((base.x + entrada.x) / 2) - 66;
  const y = Math.round((base.y + entrada.y) / 2) - 40;

  /* O efeito nasce do encontro dos dois centros, não do canto de um. */
  const c1 = base.el ? centro(base) : { x: base.x + 66, y: base.y + 96 };
  const c2 = entrada.el ? centro(entrada) : { x: entrada.x + 66, y: entrada.y + 96 };
  forja((c1.x + c2.x) / 2, (c1.y + c2.y) / 2);

  S.bancada = S.bancada.filter(p => p !== base && p !== entrada);
  const nova = novaPeca(r.out, x, y);
  nova.novo = true;
  nova.viva = inedito;
  nova.sintese = true;
  S.bancada.push(nova);

  S.registro = r.out;
  S.tentativa = [];
  desenhar();
  atualizarTrilho();
  renderNota();
  renderFita();

  falar(`${item.n}. ${item.ano ? item.ano + ", " + (item.autor || "") + "." : "Construção didática."}`);

  if (item.star) setTimeout(() => revelar(r.out), 340);
  return nova;
}

function montarEm(prox, seq, base, entrada){
  S.montagem = { r: prox.r, feitos: seq.length };
  S.bancada = S.bancada.filter(p => p !== base && p !== entrada);
  const nova = novaPeca(seq[seq.length - 1], base.x, base.y, seq);
  nova.montando = true;
  S.bancada.push(nova);
  S.registro = null;
  desenhar();
  renderNota();
  renderFita();
  const passo = IT[prox.r.seq[prox.passo]];
  falar(`Montagem em ${seq.length} de ${prox.r.seq.length}. Falta ${passo.n}.`);
  mostrarAviso(`Montagem ${seq.length}/${prox.r.seq.length} — falta ${passo.n}`);
}

function falhar(base, entrada){
  base.el.classList.add("nega");
  entrada.el.classList.add("nega");
  setTimeout(() => { base.el.classList.remove("nega"); entrada.el.classList.remove("nega"); }, 360);
  renderNota();
  renderFita();
  const a = IT[base.id].n, b = IT[entrada.id].n;
  falar(`${a} e ${b} não se combinam.`);
  mostrarAviso(`${a} + ${b} não se combinam`);
}

/* ═══════════════ SÍNTESE ═══════════════
   Núcleo, três ondas e a peça nova assentando. Roda só quando a receita
   fecha, no ponto onde os dois componentes se encontraram — é o momento
   memorável da bancada, não um enfeite de hover.                        */
function forja(px, py){
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const r = bancada.getBoundingClientRect();
  const f = document.createElement("div");
  f.className = "forja";
  f.setAttribute("aria-hidden", "true");
  f.style.left = (r.left + px) + "px";
  f.style.top  = (r.top + py) + "px";
  f.innerHTML = "<i></i><i></i><i></i><b></b>";
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
}

/* ═══════════════ AVISO ═══════════════ */
let avisoT;
function mostrarAviso(txt){
  aviso.textContent = txt;
  aviso.dataset.visivel = "1";
  clearTimeout(avisoT);
  avisoT = setTimeout(() => { aviso.dataset.visivel = "0"; }, 2100);
}
function falar(txt){ sr.textContent = txt; }

/* ═══════════════ TRILHO ═══════════════ */
function atualizarTrilho(){
  const nav = $("eras");
  const feito = id => {
    const i = ERAS.findIndex(e => e.id === id);
    return ERAS.slice(0, i).every(e => temNaEra(e.id));
  };
  nav.innerHTML = ERAS.map(e => {
    const st = e.id === S.eraAtual ? "ativa" : (feito(e.id) ? "feito" : "futuro");
    return `<span class="era-btn" data-estado="${st}">${e.curto}</span>`;
  }).join("");
  $("cDesc").textContent = S.feitos.size;
  const idx = ERAS.findIndex(e => e.id === S.eraAtual) + 1;
  $("cEra").textContent = `${idx}/7`;
  $("marcosPlaca").innerHTML = MARCOS.map(id => {
    const d = IT[id], feito = S.feitos.has(id);
    return `<span class="mp" data-on="${feito ? 1 : 0}" title="${feito ? d.n : ""}"></span>`;
  }).join("");
  const nFeitos = MARCOS.filter(id => S.feitos.has(id)).length;
  $("marcosPlaca").setAttribute("aria-label",
    `${nFeitos} de ${MARCOS.length} marcos históricos descobertos`);
  aplicarEra();
}
function temNaEra(id){ return [...S.feitos].some(f => IT[f] && IT[f].e === id); }
function aplicarEra(){
  const e = ERA[S.eraAtual];
  document.documentElement.style.setProperty("--era", e.cor);
  document.documentElement.style.setProperty("--era-texto", e.txt);
  const marcos = [...S.feitos].filter(f => IT[f].star).pop();
  if (marcos && IT[marcos].e !== S.eraAtual) S.eraAtual = IT[marcos].e;
}

/* ═══════════════ NOTA ═══════════════ */
function renderNota(){
  const partes = [];

  partes.push(`<div class="titulo-bloco">TENTATIVA NA BANCADA</div>`);
  if (S.tentativa.length){
    partes.push(`<div class="tentativa">` + S.tentativa.map(t => {
      const d = IT[t.id];
      const cadeias = t.cadeia.length > 1 ? ` · ${t.cadeia.length} etapas` : "";
      return `<div class="t-linha">
        <span class="t-ponto">${d.g}</span>
        <span class="t-nome">${d.n}<span class="b">${(d.ano || "CONSTRUÇÃO DIDÁTICA").toUpperCase()}${cadeias}</span></span>
      </div>`;
    }).join("") + `</div>`);
  } else {
    partes.push(`<p class="sem-nada">Arraste um componente até outro. Se a combinação fechar uma receita, os dois se fundem em um só. A gaveta à direita guarda o que você já descobriu — clique numa peça para trazer outra, arraste uma peça até ela para devolver, ou clique com o botão direito sobre uma peça da bancada para removê-la.</p>`);
  }

  if (S.registro){
    const d = IT[S.registro];
    partes.push(`<div class="registro">
      <div class="titulo-bloco" style="margin-bottom:9px">REGISTRO${d.star ? " · MARCO" : ""}</div>
      <div class="reg-nome">${d.n}</div>
      <div class="reg-meta">${d.ano ? `${d.ano}<span>${d.autor || ""}</span>` : `<span>ANO E AUTOR NÃO SE APLICAM</span>`}</div>
      ${d.txt ? `<p class="reg-texto">${d.txt}</p>` : ""}
      <div class="marcas">
        <span class="marca-p ${d.ano ? "on" : ""}"><i class="mk ${d.ano ? "mk-cheio" : "mk-vazio"}"></i>${d.ano ? "MARCO REAL" : "DEGRAU DIDÁTICO"}</span>
        ${d.star ? `<span class="marca-p on"><i class="mk mk-central"></i>INVENÇÃO CENTRAL</span>` : ""}
        <span class="marca-p on">${ERA[d.e].nome}</span>
      </div>
      ${filhosDe(S.registro) ? `<div class="reg-filho">Destrava: <b>${filhosDe(S.registro)}</b></div>` : ""}
    </div>`);
  }

  // O OBJETIVO é a orientação de estreia: cede o lugar ao registro assim que
  // existe uma descoberta para ler, e volta quando não há nenhuma.
  if (!S.registro){
    partes.push(`<div class="objetivo">
      <div class="titulo-bloco">OBJETIVO</div>
      <p class="obj-txt">Reconstruir a genealogia de <b>dez invenções centrais</b>, de 3500 a.C. a 2022, partindo de quatro materiais. Cada descoberta abre o registro do que foi inventado, quando e por quem.</p>
    </div>`);
  }

  nota.innerHTML = partes.join("");
  nota.querySelectorAll(".t-ponto svg,.reg-g svg").forEach(s => {
    s.style.setProperty("--p1", "var(--tinta)");
    s.style.setProperty("--p2", "#8d8478");
  });
}

function filhosDe(id){
  const nomes = RECEITAS.filter(r => r.seq.includes(id)).map(r => IT[r.out].n);
  return [...new Set(nomes)].join(" · ");
}

/* ═══════════════ FITA ═══════════════ */
function renderFita(){
  const m = S.montagem;
  const concluida = S.registro ? RECEITAS.find(x => x.out === S.registro) : null;
  const r = m ? m.r : concluida;

  if (r){
    const feitos = m ? m.feitos : r.seq.length;
    const completo = feitos >= r.seq.length;
    const livre = r.seq.length === 2;
    fitaNome.textContent = completo ? IT[r.out].n : "Montagem em andamento";
    fitaMeta.textContent = completo
      ? (livre
        ? `RECEITA DE 2 PASSOS · COMPLETA · ORDEM LIVRE`
        : `RECEITA DE ${r.seq.length} PASSOS · COMPLETA · A ORDEM IMPORTA`)
      : `RECEITA DE ${r.seq.length} PASSOS · ${feitos} CONCLUÍDO${feitos === 1 ? "" : "S"}`;
    fitaPassos.innerHTML = r.seq.map((id, i) => {
      const cls = i < feitos ? "feito" : (i === feitos ? "atual" : "");
      const seta = i < r.seq.length - 1
        ? (livre ? `<span class="mais">+</span>` : `<span class="seta"></span>`) : "";
      const ord = livre ? "" : `<span class="passo-ord">${String(i+1).padStart(2,"0")}</span>`;
      return `<span class="passo ${cls}">${ord}<span class="passo-nome">${IT[id].n}</span></span>${seta}`;
    }).join("") + (!completo
      ? `${feitos < r.seq.length-1 ? `<span class="seta"></span>` : ""}<span class="aguardando">AGUARDANDO</span>` : "");
  } else {
    fitaNome.textContent = S.registro ? IT[S.registro].n : "Bancada sem receita ativa";
    fitaMeta.textContent = "NENHUMA TENTATIVA REGISTRADA";
    fitaPassos.innerHTML = `<span class="fita-nada">Arraste dois componentes um sobre o outro. Se a combinação fechar uma receita, a fita mostra os passos na ordem em que precisam ser montados.</span>`;
  }
}

/* ═══════════════ REVELAÇÃO DE MARCO ═══════════════ */
function revelar(id){
  const d = IT[id];
  const rev = $("revelacao");
  // O aviso da bancada pode estar dizendo "falta X" no instante da descoberta.
  clearTimeout(avisoT);
  aviso.dataset.visivel = "0";
  aviso.textContent = "";
  falar(`Descoberta: ${d.n}. ${d.ano ? d.ano + ". " : ""}${d.autor || ""}`);
  $("revNome").textContent = d.n;
  $("revGrafico").innerHTML = d.g;
  $("revGrafico").firstElementChild.style.setProperty("--p1", "var(--tinta)");
  $("revGrafico").firstElementChild.style.setProperty("--p2", "#8d8478");
  if (PATINA[id]) $("revGrafico").firstElementChild.style.setProperty("--p3", MAT[PATINA[id]]);
  $("revMeta").innerHTML =
    `<span class="rev-era"><span class="rev-idade">${ERA[d.e].nome}</span>${d.star ? `<span class="rev-central"><i class="mk mk-central"></i>INVENÇÃO CENTRAL</span>` : ""}</span>` +
    `${d.ano}` +
    (d.autor ? `<span class="rev-autor">${d.autor}</span>` : "");
  $("revTexto").textContent = d.txt || "";
  rev.dataset.visivel = "1";
  $("revOk").focus();
  setTimeout(() => {
    S.eraAtual = d.e;
    aplicarEra(); atualizarTrilho();
  }, 60);
}

/* ═══════════════ CÓDIGO ═══════════════ */
function abrirCodigo(foco){
  const f = $("codigoFundo"), c = $("codigo");
  f.dataset.aberto = "1";
  c.setAttribute("aria-hidden", "false");
  renderCodigo();
  if (foco) $("btnFechar").focus();
}
function fecharCodigo(){
  $("codigoFundo").dataset.aberto = "0";
  $("codigo").setAttribute("aria-hidden", "true");
  $("btnCodex").focus();
}
function renderCodigo(){
  const corpo = $("codigoCorpo");
  corpo.innerHTML = ERAS.map(e => {
    const lista = Object.keys(IT).filter(id => IT[id].e === e.id);
    const n = lista.filter(id => S.feitos.has(id)).length;
    return `<section class="era-secao">
      <div class="era-cab">
        <span class="era-cor" style="background:${e.cor}"></span>
        <span class="era-nome">${e.nome}</span>
        <span class="era-q">${n}/${lista.length}</span>
      </div>
      ${lista.map(id => {
        const d = IT[id], ok = S.feitos.has(id);
        return `<div class="reg ${ok ? "" : "bloq"}">
          <span class="reg-g">${arte(id)}</span>
          <span class="reg-t">
            <span class="reg-n">${ok ? d.n : "· · · · · · ·"}</span>
            <span class="reg-d">${ok ? (d.ano || "CONSTRUÇÃO DIDÁTICA") : "NÃO DESCOBERTO"}</span>
          </span>
          ${d.star ? `<span class="reg-star"><i class="mk mk-central"></i><span class="sr">Invenção central</span></span>` : ""}
        </div>`;
      }).join("")}
    </section>`;
  }).join("");
  corpo.querySelectorAll(".reg-g svg").forEach(s => {
    s.style.setProperty("--p1", "var(--tinta)");
    s.style.setProperty("--p2", "#8d8478");
  });
}

/* ═══════════════ PERSISTÊNCIA ═══════════════ */
function salvar(){
  try {
    localStorage.setItem(CHAVE, JSON.stringify({
      feitos: [...S.feitos], era: S.eraAtual,
      bancada: S.bancada.map(p => ({ id:p.id, cadeia:p.cadeia, x:p.x, y:p.y, m:p.montando }))
    }));
  } catch(e){}
}
function carregar(){
  try {
    const raw = localStorage.getItem(CHAVE) || localStorage.getItem(CHAVE_ANTIGA);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d.feitos || !d.feitos.length) return false;
    S.feitos = new Set(d.feitos);
    S.eraAtual = d.era || "terra";
    S.bancada = d.bancada.map(b => ({ ...novaPeca(b.id, b.x, b.y, b.cadeia), montando:!!b.m }));
    /* A bancada pode ter encolhido desde a última sessão — peça fora da
       chapa é peça perdida, então tudo volta para dentro dos limites.  */
    const W = bancada.clientWidth, H = alturaUtil();
    S.bancada.forEach(p => {
      p.x = Math.max(0, Math.min(W - ladoPeca(), p.x));
      p.y = Math.max(0, Math.min(H - alturaPeca(), p.y));
    });
    localStorage.removeItem(CHAVE_ANTIGA);
    return true;
  } catch(e){ return false; }
}

/* ═══════════════ INÍCIO ═══════════════ */
function marcasTotais(){
  document.getElementById("cTot").textContent = Object.keys(IT).length;
}

function iniciar(){
  marcasTotais();
  if (!carregar()) semear();
  else aplicarEra();
  desenhar();
  atualizarTrilho();
  renderNota();
  renderFita();
  renderCodigo();

  document.addEventListener("keydown", ev => {
    if (ev.key === "Escape"){
      if ($("revelacao").dataset.visivel === "1"){ fecharRev(); }
      else if ($("codigoFundo").dataset.aberto === "1") fecharCodigo();
    }
  });
  const gavLista = $("gavLista");
  gavLista.addEventListener("click", ev => {
    const b = ev.target.closest(".gav-item");
    if (b) puxarPeca(b.dataset.id);
  });
  /* Hover e foco abrem a ficha; rolar a lista fecha para a dica não ficar
     pendurada num item que saiu de quadro.                                */
  gavLista.addEventListener("pointerover", ev => {
    const b = ev.target.closest(".gav-item");
    if (b && !b.contains(ev.relatedTarget)) agendarDica(b.dataset.id, b);
  });
  gavLista.addEventListener("pointerout", ev => {
    const b = ev.target.closest(".gav-item");
    if (b && !b.contains(ev.relatedTarget)) fecharDica();
  });
  gavLista.addEventListener("focusin", ev => {
    const b = ev.target.closest(".gav-item");
    if (b) agendarDica(b.dataset.id, b);
  });
  gavLista.addEventListener("focusout", fecharDica);
  gavLista.addEventListener("scroll", fecharDica, { passive:true });
  $("btnCodex").addEventListener("click", () => abrirCodigo(true));
  $("btnFechar").addEventListener("click", fecharCodigo);
  $("codigoFundo").addEventListener("click", fecharCodigo);
  $("revOk").addEventListener("click", fecharRev);
  $("revCodex").addEventListener("click", () => { fecharRev(); abrirCodigo(false); });

  let rt;
  window.addEventListener("resize", () => {
    clearTimeout(rt);
    rt = setTimeout(() => {
      S.bancada.forEach(repositionar);
      desenhar();
    }, 160);
  });
  setInterval(salvar, 4000);
  window.addEventListener("beforeunload", salvar);
}

function fecharRev(){
  $("revelacao").dataset.visivel = "0";
  aplicarEra(); atualizarTrilho();
  salvar();
}

iniciar();
</script>
